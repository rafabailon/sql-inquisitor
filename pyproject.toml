[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-inquisitor"
version = "1.0.0"
description = "An ethical, self-contained SQL injection detection tool for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SQL Inquisitor contributors" }]
keywords = ["security", "pentesting", "sql-injection", "scanner", "ethical-hacking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
sql-inquisitor = "cli:entrypoint"

[project.urls]
Homepage = "https://github.com/example/sql-inquisitor"
Documentation = "https://github.com/example/sql-inquisitor/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "cli",
    "config",
    "crawler",
    "engine",
    "errors",
    "ethics",
    "heuristics",
    "http_client",
    "logging_utils",
    "models",
    "payloads",
    "reporting",
    "signatures",
    "tamper",
    "version",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that use a local HTTP lab server",
    "slow: tests that include deliberate response delays",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
